spring.application.name=Orchestra

# Server
server.port=8085


# ===============================
# PostgreSQL Database
# ===============================

spring.datasource.url=jdbc:postgresql://localhost:5432/PRODB

spring.datasource.username=postgres

spring.datasource.password=2112


# Driver
spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# Logging
# ===============================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JWT

jwt.secret=MySuperSecretKeyForJWTGenerationMySuperSecretKey123456789
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.authorization=TRACE
jwt.expiration=3600000

flowable.database-schema-update=true
flowable.async-executor-activate=true
spring.jpa.defer-datasource-initialization=true
flowable.check-process-definitions=true
#flowable.process-definition-location-prefix=classpath:/processes/
#flowable.process-definition-location-suffixes=**.bpmn20.xml