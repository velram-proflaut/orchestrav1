name: Orchestra CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t velramproflau/orchestra:${{ github.sha }} \
            -t velramproflau/orchestra:latest \
            .

      - name: Push Docker image
        run: |
          docker push velramproflau/orchestra:${{ github.sha }}
          docker push velramproflau/orchestra:latest

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          mkdir -p ~/.ssh

          echo "$SERVER_SSH_KEY" > ~/.ssh/orchestra_deploy
          chmod 600 ~/.ssh/orchestra_deploy

          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/orchestra_deploy \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "echo '$DOCKERHUB_TOKEN' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

          ssh \
            -i ~/.ssh/orchestra_deploy \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE_SCRIPT'

          set -e

          IMAGE="velramproflau/orchestra:${IMAGE_TAG}"
          CONTAINER_NAME="orchestra-app"
          ENV_FILE="/usr/local/customApps/orchestra.env"
          PORT="9097"
          HEALTH_URL="http://localhost:${PORT}/actuator/health"

          echo "========================================="
          echo "Deploying Orchestra"
          echo "Image: $IMAGE"
          echo "========================================="

          echo "Pulling Docker image..."
          docker pull "$IMAGE"

          echo "Checking existing Orchestra container..."

          PREVIOUS_IMAGE=""

          if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              PREVIOUS_IMAGE=$(docker inspect \
                --format='{{.Config.Image}}' \
                "$CONTAINER_NAME" || true)
          fi

          echo "Previous Docker image: $PREVIOUS_IMAGE"

          JAR_WAS_RUNNING=false

          if systemctl is-active --quiet HomeService.service; then
              JAR_WAS_RUNNING=true
              echo "Existing HomeService.service is running."
          fi

          echo "Stopping existing Orchestra container if present..."
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if [ "$JAR_WAS_RUNNING" = true ]; then
              echo "Stopping HomeService.service..."
              systemctl stop HomeService.service
          fi

          echo "Starting new Orchestra Docker container..."

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p "$PORT:$PORT" \
            "$IMAGE"

          echo "Waiting for application health..."

          HEALTH_OK=false

          for i in {1..30}; do

              if curl -fsS "$HEALTH_URL" >/tmp/orchestra-health.json 2>/dev/null; then
                  HEALTH_OK=true
                  break
              fi

              echo "Health check attempt $i/30..."
              sleep 5

          done

          if [ "$HEALTH_OK" = true ]; then

              echo "========================================="
              echo "Orchestra deployment SUCCESS"
              echo "========================================="

              cat /tmp/orchestra-health.json

              exit 0
          fi

          echo "========================================="
          echo "Orchestra deployment FAILED"
          echo "Starting rollback..."
          echo "========================================="

          echo "Docker logs:"
          docker logs "$CONTAINER_NAME" --tail 100 || true

          echo "Removing failed container..."
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if [ -n "$PREVIOUS_IMAGE" ]; then

              echo "Previous Docker image found:"
              echo "$PREVIOUS_IMAGE"

              echo "Starting previous Docker image..."

              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                --env-file "$ENV_FILE" \
                -p "$PORT:$PORT" \
                "$PREVIOUS_IMAGE"

              sleep 10

              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then

                  echo "========================================="
                  echo "Docker rollback SUCCESS"
                  echo "========================================="

                  exit 1
              fi

              echo "Docker rollback failed."

          fi

          echo "Starting original HomeService.service..."

          systemctl start HomeService.service

          sleep 10

          if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
              echo "Original JAR service restored successfully."
          else
              echo "WARNING: Original JAR service did not become healthy."
          fi

          exit 1

          REMOTE_SCRIPT